# ============================================================
#  Proton VPN Plus — configurazione integrata (WaveGuard)
# ============================================================
#
#  COME ATTIVARLA (una sola volta, lato sviluppatore):
#    1. Vai su https://account.protonvpn.com → Downloads
#       → WireGuard configuration
#    2. Genera/scarica la configurazione per il server Plus che vuoi usare
#       (puoi generarne più di una: una per server/Paese).
#    3. Incolla qui sotto il contenuto COMPLETO del file .conf, sostituendo
#       questo blocco. Puoi incollare più configurazioni nello stesso file
#       (ognuna inizia con [Interface]): verranno tutte importate.
#    4. Ricompila l'APK. Tutti gli utenti che installano quell'APK riceveranno
#       automaticamente le stesse configurazioni, senza importare alcun file.
#
#  NOTA: questa configurazione resta interna all'app (asset dell'APK).
#  NON committare questo file con la chiave privata reale se il repository
#  è pubblico: usa un .gitignore o sostituisci la chiave prima del commit.
#
#  Esempio di struttura (sostituire i valori):
#
#  [Interface]
#  PrivateKey = <PRIVATE_KEY>
#  Address = 10.2.0.2/32
#  DNS = 10.2.0.1
#
#  [Peer]
#  PublicKey = <PEER_PUBLIC_KEY>
#  AllowedIPs = 0.0.0.0/0
#  Endpoint = 1.2.3.4:51820
# ============================================================

# --- INCOLLA QUI SOTTO LA CONFIGURAZIONE REALE (rimuovi questa riga e i commenti guida) ---
# [Interface]
# PrivateKey = INSERISCI_QUI_LA_TUA_PRIVATE_KEY
# Address = 10.2.0.2/32
# DNS = 10.2.0.1
#
# [Peer]
# PublicKey = INSERISCI_QUI_LA_PEER_PUBLIC_KEY
# AllowedIPs = 0.0.0.0/0
# Endpoint = INSERISCI_QUI_HOST:PORTA
